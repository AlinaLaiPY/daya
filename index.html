<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="車行記帳">
<meta name="theme-color" content="#1b7a4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>大雅車行 每日記帳</title>
<style>
:root{
  --green:#1b7a4a; --green-light:#e6f4ec; --green-mid:#6ee9a4;
  --ink:#15211b; --muted:#5d6b64; --line:#d5ddd8; --bg:#f4f7f5;
  --danger:#c0392b; --white:#fff;
  --pad: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;}
/* 按下去的回饋：所有按鈕按壓時縮小變色，放開後還會閃一下，確保看得到 */
@keyframes pressed{0%{transform:scale(1);}40%{transform:scale(.93);}100%{transform:scale(1);}}
button.pressed{animation:pressed .3s ease;}
@keyframes pagein{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
.page.on{animation:pagein .22s ease;}
@media (prefers-reduced-motion: reduce){button.pressed{animation:none;} .page.on{animation:none;}}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:19px; line-height:1.5;
  padding-bottom:calc(96px + var(--pad));
  -webkit-text-size-adjust:100%;
}
header{
  position:sticky; top:0; z-index:50; background:var(--green); color:#fff;
  padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.monthbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.monthbar button{
  background:rgba(255,255,255,.18); border:0; color:#fff; font-size:26px;
  width:52px; height:52px; border-radius:14px; line-height:1;
}
.monthbar button:active{background:rgba(255,255,255,.35);}
.mtitle{font-size:23px; font-weight:700; text-align:center; flex:1;}
.mtitle small{display:block; font-size:14px; font-weight:400; opacity:.9; margin-top:2px;}

main{padding:14px 12px 10px; max-width:560px; margin:0 auto;}
.page{display:none;} .page.on{display:block;}

.card{background:var(--white); border-radius:16px; padding:16px; margin-bottom:14px;
      box-shadow:0 1px 3px rgba(0,0,0,.07);}
.card h2{margin:0 0 12px; font-size:19px; color:var(--green); letter-spacing:.5px;}

label.f{display:block; margin-bottom:16px;}
label.f > span{display:block; font-size:17px; font-weight:700; margin-bottom:6px; color:var(--muted);}
input, textarea{
  width:100%; font-size:21px; font-family:inherit; color:var(--ink);
  padding:14px 12px; border:2px solid var(--line); border-radius:12px; background:#fff;
  -webkit-appearance:none; appearance:none;
}
input:focus, textarea:focus{outline:none; border-color:var(--green);}
input[type=date]{min-height:56px;}
textarea{min-height:64px; resize:none;}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{
  border:2px solid var(--green); color:var(--green); background:#fff;
  border-radius:999px; padding:9px 15px; font-size:17px; font-weight:700; font-family:inherit;
}
.chip:active{background:var(--green); color:#fff;}
.chip.clear{border-color:#b9c4be; color:var(--muted);}

.fold{border:2px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden; background:#fff;}
.fold > .head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; font-size:19px; font-weight:700; color:var(--green); background:#fafcfb;
}
.fold > .body{padding:16px 16px 2px; display:none; border-top:2px solid var(--line);}
.fold.open > .body{display:block;}
.fold .arrow{font-size:16px; transition:transform .15s;}
.fold.open .arrow{transform:rotate(180deg);}
.badge{background:var(--green); color:#fff; border-radius:999px; font-size:14px; padding:2px 10px; margin-left:8px;}

.btn{
  display:block; width:100%; border:0; border-radius:14px; padding:20px;
  font-size:22px; font-weight:800; font-family:inherit; color:#fff; background:var(--green);
  margin-top:6px;
}
.btn:active{filter:brightness(.85); transform:scale(.97);}
.btn.flash{background:#0f5c33; transform:scale(1.02);}
.btn{transition:transform .12s, filter .12s;}
.btn.sub{background:#fff; color:var(--green); border:2px solid var(--green); font-size:19px; padding:15px;}
.btn.danger{background:#fff; color:var(--danger); border:2px solid var(--danger); font-size:19px; padding:15px;}
.btn.grey{background:#fff; color:var(--muted); border:2px solid var(--line); font-size:18px; padding:14px;}

.editing{background:#fff5d6; border:2px solid #e0b400; border-radius:12px; padding:12px;
         margin-bottom:14px; font-size:17px; font-weight:700; display:none; justify-content:space-between; align-items:center;}
.editing.on{display:flex;}
.editing button{border:0; background:#e0b400; color:#fff; border-radius:10px; padding:8px 14px; font-size:16px; font-family:inherit;}

/* 統計 */
.stat{display:flex; justify-content:space-between; align-items:baseline; padding:12px 2px; border-bottom:1px dashed var(--line); gap:8px;}
.stat:last-child{border-bottom:0;}
.stat b{font-size:18px; font-weight:700; color:var(--muted);}
.stat b small{font-weight:400; font-size:14px; display:block;}
.stat span{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;}
.stat.total{background:var(--green-light); margin:8px -16px -16px; padding:16px; border-radius:0 0 16px 16px;}
.stat.total b{color:var(--green); font-size:20px;}
.stat.total span{color:var(--green); font-size:28px;}
.stat.total span.neg{color:var(--danger);}

/* 紀錄卡 */
.rec{background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.07);}
.rec .top{display:flex; gap:10px; align-items:center; margin-bottom:4px;}
.rec .day{background:var(--green); color:#fff; border-radius:10px; padding:4px 10px; font-size:16px; font-weight:800; white-space:nowrap;}
.rec .cust{font-size:20px; font-weight:800; flex:1; word-break:break-all;}
.rec .trip{font-size:17px; color:var(--muted); margin-bottom:8px; word-break:break-all;}
.rec .nums{font-size:17px; display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:10px; font-variant-numeric:tabular-nums;}
.rec .nums i{font-style:normal; color:var(--muted);}
.rec .acts{display:flex; gap:10px;}
.rec .acts button{flex:1; border-radius:10px; padding:11px; font-size:17px; font-family:inherit; font-weight:700;
                  border:2px solid var(--line); background:#fff; color:var(--muted);}
.rec .acts .ed{border-color:var(--green); color:var(--green);}
.rec .acts .de{border-color:#e8c4bf; color:var(--danger);}
.empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:18px;}
.day-found{color:var(--muted); font-size:16px; font-weight:700; margin:2px 4px 10px;}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:searchfield-cancel-button;}

nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; background:#fff;
  border-top:2px solid var(--line); padding-bottom:var(--pad);
  box-shadow:0 -2px 10px rgba(0,0,0,.06);
}
nav button{
  flex:1; border:0; background:none; font-family:inherit; padding:10px 4px 12px;
  font-size:15px; font-weight:700; color:var(--muted); line-height:1.25;
}
nav button em{display:block; font-style:normal; font-size:26px; margin-bottom:2px;}
nav button.on{color:var(--green);}

.toast{
  position:fixed; left:50%; bottom:calc(110px + var(--pad)); transform:translateX(-50%) translateY(20px);
  background:#15211b; color:#fff; padding:16px 26px; border-radius:14px; font-size:19px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:88%; text-align:center;
}
.toast.on{opacity:.96; transform:translateX(-50%) translateY(0);}
.undobar{
  position:fixed; left:50%; bottom:calc(110px + var(--pad)); transform:translateX(-50%) translateY(20px);
  background:#15211b; color:#fff; padding:12px 14px 12px 22px; border-radius:14px;
  font-size:19px; font-weight:700; display:flex; align-items:center; gap:14px;
  opacity:0; pointer-events:none; transition:.25s; z-index:101; white-space:nowrap;
}
.undobar.on{opacity:.97; transform:translateX(-50%) translateY(0); pointer-events:auto;}
.undobar button{
  border:0; background:var(--green-mid); color:#0d3320; border-radius:10px;
  padding:10px 18px; font-size:18px; font-weight:800; font-family:inherit;
}
.hint{font-size:16px; color:var(--muted); line-height:1.6; margin:10px 0 0;}
.hint b{color:var(--ink);}
/* 自製確認視窗（內嵌環境擋掉了瀏覽器內建的 confirm/prompt） */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:none; align-items:center; justify-content:center; padding:24px;}
.overlay.on{display:flex;}
.dlg{background:var(--white); border-radius:16px; padding:20px; width:100%; max-width:400px; box-shadow:0 8px 30px rgba(0,0,0,.25);}
.dlg p{font-size:19px; line-height:1.6; margin:0 0 16px; white-space:pre-line; word-break:break-all;}
.dlg input{margin-bottom:16px;}
.dlg .row{display:flex; gap:10px;}
.dlg .row button{flex:1; border-radius:12px; padding:15px; font-size:19px; font-weight:700; font-family:inherit; border:2px solid var(--line); background:#fff; color:var(--muted);}
.dlg .row .ok{background:var(--green); border-color:var(--green); color:#fff;}
.dlg .row .ok.red{background:var(--danger); border-color:var(--danger);}
.fixedrow{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--green-light); border-radius:12px; padding:12px 14px; margin-top:14px; font-size:17px;
}
.fixedrow b{font-size:20px; font-variant-numeric:tabular-nums;}
.fixedrow small{display:block; font-size:14px; color:var(--muted);}
.fixedrow button{
  border:2px solid var(--line); background:#fff; color:var(--muted); border-radius:10px;
  padding:8px 14px; font-size:15px; font-family:inherit; white-space:nowrap;
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none;} .fold .arrow{transition:none;} }
</style>
</head>
<body>

<header>
  <div class="monthbar">
    <button id="prevM" aria-label="上個月">‹</button>
    <div class="mtitle"><span id="mLabel">2026年8月</span><small id="mSub"></small></div>
    <button id="nextM" aria-label="下個月">›</button>
  </div>
</header>

<main>

<!-- ══════════ 記一筆 ══════════ -->
<section class="page on" id="p-add">
  <div class="editing" id="editBanner">
    <span>修改中的紀錄</span><button id="cancelEdit">取消修改</button>
  </div>

  <div class="card">
    <label class="f"><span>日期</span>
      <input type="date" id="f_date" min="2026-01-01" max="2026-12-31">
      <div class="chips">
        <button class="chip" id="chipToday">今天</button>
        <button class="chip" id="chipYest">昨天</button>
      </div>
    </label>

    <label class="f"><span>客戶名稱</span>
      <input type="text" id="f_name" list="dl_name" placeholder="例：林小姐" autocomplete="off">
      <datalist id="dl_name"></datalist>
    </label>

    <label class="f"><span>行程</span>
      <input type="text" id="f_trip" list="dl_trip" placeholder="先打地點，再按下面按鈕" autocomplete="off">
      <datalist id="dl_trip"></datalist>
      <div class="chips">
        <button class="chip" data-trip="suf">～桃機（去）</button>
        <button class="chip" data-trip="pre">桃機～（回）</button>
        <button class="chip clear" data-trip="clr">清除</button>
      </div>
    </label>

    <label class="f"><span>實收（客人給的錢）</span>
      <input type="text" id="f_fare" inputmode="decimal" placeholder="收到的金額" autocomplete="off">
      <div class="chips">
        <button class="chip" data-fare="X">X（沒收）</button>
        <button class="chip" data-fare="免簽收">免簽收</button>
        <button class="chip" data-fare="A車收">A車收</button>
        <button class="chip clear" data-fare="">清除</button>
      </div>
    </label>

    <label class="f" style="margin-bottom:4px"><span>工資</span>
      <input type="text" id="f_wage" inputmode="numeric" placeholder="例：700" autocomplete="off">
      <div class="chips" id="wageChips"></div>
    </label>
  </div>

  <div class="fold" id="foldCost">
    <div class="head">加油・停車・其他費用<span class="arrow">▾</span></div>
    <div class="body">
      <label class="f"><span>油資</span><input type="text" id="f_fuel" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>洗車</span><input type="text" id="f_wash" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>計程車</span><input type="text" id="f_taxi" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>停車</span><input type="text" id="f_park" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>舉牌</span><input type="text" id="f_flag" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>其他費用</span><input type="text" id="f_other" inputmode="numeric" autocomplete="off"></label>
    </div>
  </div>

  <div class="fold" id="foldNote">
    <div class="head">備註・回帳・月結<span class="arrow">▾</span></div>
    <div class="body">
      <label class="f"><span>備註</span><textarea id="f_note" placeholder="例：三處、Uber"></textarea></label>
      <label class="f"><span>回帳</span><input type="text" id="f_back" inputmode="numeric" autocomplete="off"></label>
      <label class="f"><span>月結（簽單）</span><input type="text" id="f_monthly" inputmode="numeric" autocomplete="off"></label>
    </div>
  </div>

  <button class="btn" id="saveBtn">儲存這一筆</button>
  <button class="btn danger" id="deleteBtn" style="margin-top:10px; display:none">刪除這一筆</button>
  <button class="btn grey" id="clearBtn" style="margin-top:10px">清空重填</button>
</section>

<!-- ══════════ 本月紀錄 ══════════ -->
<section class="page" id="p-list">
  <div class="card" style="padding:12px 14px">
    <input type="search" id="f_search" placeholder="🔍 找客戶、地點或日期" autocomplete="off">
  </div>
  <div class="card" id="statCard">
    <h2>本月統計</h2>
    <div id="statBox"></div>
  </div>
  <div id="listBox"></div>
</section>

<!-- ══════════ 產出報表 ══════════ -->
<section class="page" id="p-out">
  <div class="card">
    <h2>產出 Excel 報表</h2>
    <button class="btn" id="shareBtn">傳給公司（LINE）</button>
    <button class="btn sub" id="exportBtn" style="margin-top:10px">下載 Excel 檔</button>
    <div class="fixedrow">
      <span>勞健保補貼 <b id="laborShow">3,000</b><small>公司固定給，已寫進報表</small></span>
      <button id="laborEdit" type="button">修改</button>
    </div>
    <p class="hint">檔案格式跟公司的表一樣，12 個月都在裡面。<b>產出前會自動逐格核對</b>，資料完全一致才會產出。</p>
  </div>

  <div class="card">
    <h2>資料備份</h2>
    <p class="hint">資料存在這支手機裡，建議每個月備份一次。</p>
    <button class="btn sub" id="backupBtn" style="margin-top:12px">備份全部資料</button>
    <button class="btn grey" id="restoreBtn" style="margin-top:10px">從備份還原</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
  </div>
</section>

</main>

<nav>
  <button class="on" data-go="p-add"><em>✏️</em>記一筆</button>
  <button data-go="p-list"><em>📋</em>本月紀錄</button>
  <button data-go="p-out"><em>📤</em>產出報表</button>
</nav>

<div class="toast" id="toast"></div>
<div class="undobar" id="undoBar"><span>已刪除</span><button id="undoBtn" type="button">復原</button></div>

<div class="overlay" id="dlgWrap">
  <div class="dlg">
    <p id="dlgMsg"></p>
    <input type="text" id="dlgInput" inputmode="numeric" style="display:none">
    <div class="row">
      <button id="dlgCancel" type="button">取消</button>
      <button id="dlgOk" class="ok" type="button">確定</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ════════════════ 資料 ════════════════ */
const YEAR = 2026;
const KEY = 'daya-report-2026';
const OLD_KEY = 'daya_carline_v1';   // 另一版的資料，自動搬過來

const NUMK = ['fare','wage','fuel','wash','taxi','park','flag','other','back','monthly'];
let store = load();
let curMonth = defaultMonth();
let editingId = null;

function emptyStore(){
  const months = {};
  for(let i=1;i<=12;i++) months[i] = {entries:[], ins:3000};
  return {months};
}
function load(){
  let s = null;
  try{
    const p = JSON.parse(localStorage.getItem(KEY));
    if(p && p.months) s = p;
  }catch(e){}
  if(!s){
    s = emptyStore();
    const old = migrateOld();
    if(old){
      // 舊版資料（含當時的預載）整批搬入，不再重複加預載
      old.forEach(e=>{ s.months[e.m].entries.push(e); });
      for(let i=1;i<=12;i++) sortEntries(s.months[i].entries);
      s.seedVersion = SEED_VERSION;
    }
  }
  if(s.seedVersion !== SEED_VERSION){
    for(const [m, list] of Object.entries(SEED)){
      if(!Array.isArray(list)) continue;
      const have = new Set(s.months[m].entries.map(e=>e.id));
      list.forEach((e,i)=>{
        const id = `seed-${m}-${i}`;
        if(!have.has(id)) s.months[m].entries.push(Object.assign({id, m:+m}, e));
      });
      sortEntries(s.months[m].entries);
    }
    s.seedVersion = SEED_VERSION;
  }
  // 勞健保：全年共用一個固定值（公司固定補貼）
  if(num(s.ins)==null) s.ins = 3000;
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  return s;
}
function laborVal(){ const n = num(store.ins); return n==null ? 3000 : n; }
function migrateOld(){
  try{
    const d = JSON.parse(localStorage.getItem(OLD_KEY));
    if(!d || !Array.isArray(d.records) || !d.records.length) return null;
    const out = [];
    d.records.forEach((r,i)=>{
      if(!r.date) return;
      const m = parseInt(r.date.slice(5,7),10), day = parseInt(r.date.slice(8,10),10);
      if(!(m>=1 && m<=12)) return;
      const inc = (r.income||'').trim();
      const nn = v => { const n = parseFloat(String(v==null?'':v).replace(/[,\s，]/g,'')); return isFinite(n)?n:null; };
      out.push({
        id: 'mig-'+(r.id||i), m, date: `${m}/${day}`,
        name:(r.cust||'').trim(), trip:(r.trip||'').trim(),
        fare: nn(inc), fareX: inc==='X',
        fareNote: (inc && inc!=='X' && nn(inc)==null) ? inc : null,
        wage:nn(r.wage), fuel:nn(r.fuel), wash:nn(r.wash), taxi:nn(r.taxi),
        park:nn(r.park), flag:nn(r.sign), other:nn(r.other),
        back:nn(r.back), monthly:nn(r.monthly), note:(r.note||'').trim()
      });
    });
    return out.length ? out : null;
  }catch(e){ return null; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ toast('儲存失敗，手機空間可能不足'); }
}
function M(n){ return store.months[n || curMonth]; }
function defaultMonth(){
  const d = new Date();
  return d.getFullYear() === YEAR ? d.getMonth()+1 : 1;
}
function num(v){ const n = parseFloat(String(v==null?'':v).replace(/[,\s，]/g,'')); return isFinite(n) ? n : null; }
function sortEntries(arr){
  arr.sort((a,b)=>{
    const da = parseInt(a.date.split('/')[1],10), db = parseInt(b.date.split('/')[1],10);
    return da - db || String(a.id).localeCompare(String(b.id));
  });
}
function findEntry(id){
  for(let i=1;i<=12;i++){
    const hit = store.months[i].entries.find(x=>x.id===id);
    if(hit) return hit;
  }
  return null;
}

/* ════════════════ 畫面 ════════════════ */
const $ = id => document.getElementById(id);
function money(n){ return Math.round(n).toLocaleString('zh-TW'); }
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2000);
}
/* 自製對話框：ask(訊息) → true/false；ask(訊息,{input:預設值}) → 字串或 null；ask(訊息,{alert:true}) → 提示 */
let dlgResolve = null;
function ask(msg, opts={}){
  return new Promise(res=>{
    dlgResolve = res;
    $('dlgMsg').textContent = msg;
    const inp = $('dlgInput');
    if(opts.input !== undefined){ inp.style.display='block'; inp.value = opts.input; }
    else inp.style.display='none';
    $('dlgOk').textContent = opts.okText || '確定';
    $('dlgOk').classList.toggle('red', !!opts.danger);
    $('dlgCancel').style.display = opts.alert ? 'none' : 'block';
    $('dlgWrap').classList.add('on');
  });
}
function closeDlg(ok){
  $('dlgWrap').classList.remove('on');
  const r = dlgResolve; dlgResolve = null;
  if(!r) return;
  if(!ok) r(null);
  else r($('dlgInput').style.display==='none' ? true : $('dlgInput').value);
}
document.getElementById('dlgOk').addEventListener('click', ()=>closeDlg(true));
document.getElementById('dlgCancel').addEventListener('click', ()=>closeDlg(false));

/* 每顆按鈕按下都有看得到的回饋 */
document.addEventListener('touchstart', ()=>{}, {passive:true}); // 啟用 iOS 的 :active 效果
document.addEventListener('pointerdown', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  b.classList.remove('pressed');
  void b.offsetWidth; // 強制重排，讓動畫每次都重新播放
  b.classList.add('pressed');
  setTimeout(()=>b.classList.remove('pressed'), 320);
});
/* 按鈕短暫變成「✓ 完成」字樣 */
function flashBtn(btn, txt){
  const orig = btn.dataset.origText || btn.textContent;
  btn.dataset.origText = orig;
  btn.textContent = txt; btn.classList.add('flash');
  clearTimeout(btn._flashT);
  btn._flashT = setTimeout(()=>{
    btn.textContent = btn.dataset.origText; btn.classList.remove('flash');
    delete btn.dataset.origText;
  }, 1000);
}

/* 刪除後 8 秒內可復原 */
let lastDeleted = null, undoT;
function offerUndo(entry){
  lastDeleted = entry;
  const b = $('undoBar'); b.classList.add('on');
  clearTimeout(undoT); undoT = setTimeout(()=>b.classList.remove('on'), 8000);
}
document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(!lastDeleted) return;
  const m = lastDeleted.m;
  store.months[m].entries.push(lastDeleted);
  sortEntries(store.months[m].entries);
  save(); lastDeleted = null;
  $('undoBar').classList.remove('on'); clearTimeout(undoT);
  setMonth(m); toast('已復原 ✓');
});

const navBtns = document.querySelectorAll('nav button');
navBtns.forEach(b=>b.addEventListener('click', ()=>go(b.dataset.go)));
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id===id));
  navBtns.forEach(b=>b.classList.toggle('on', b.dataset.go===id));
  window.scrollTo(0,0);
  if(id==='p-list') renderList();
}
['foldCost','foldNote'].forEach(id=>{
  $(id).querySelector('.head').addEventListener('click', ()=>$(id).classList.toggle('open'));
});

/* ════════════════ 月份 ════════════════ */
function dateVal(m,d){ return `${YEAR}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function refreshHeader(){
  $('mLabel').textContent = `${YEAR}年${curMonth}月`;
  const n = M().entries.length;
  $('mSub').textContent = n ? `${n} 筆紀錄` : '還沒有紀錄';
}
function setMonth(m){
  const changed = m !== curMonth;
  curMonth = Math.min(12, Math.max(1, m));
  if(changed) $('f_search').value = '';
  refreshHeader(); renderList(); renderChips();
}
$('f_search').addEventListener('input', renderList);
$('prevM').addEventListener('click', ()=>setMonth(curMonth-1));
$('nextM').addEventListener('click', ()=>setMonth(curMonth+1));

/* ════════════════ 表單 ════════════════ */
const FORM_NUM = {f_wage:'wage', f_fuel:'fuel', f_wash:'wash', f_taxi:'taxi', f_park:'park', f_flag:'flag', f_other:'other', f_back:'back', f_monthly:'monthly'};
function todayStr(off){
  const d = new Date();
  if(off) d.setDate(d.getDate()+off);
  return d.getFullYear()===YEAR ? dateVal(d.getMonth()+1, d.getDate()) : dateVal(1,1);
}
$('chipToday').addEventListener('click', ()=>{ $('f_date').value = todayStr(0); });
$('chipYest').addEventListener('click', ()=>{ $('f_date').value = todayStr(-1); });

document.querySelectorAll('[data-trip]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const t = $('f_trip');
    const v = t.value.trim().replace(/^～+|～+$/g,'');
    if(b.dataset.trip==='suf') t.value = v ? v+'～桃機' : '～桃機';
    else if(b.dataset.trip==='pre') t.value = v ? '桃機～'+v : '桃機～';
    else t.value = '';
    t.focus(); updateBadges();
  });
});
document.querySelectorAll('[data-fare]').forEach(b=>{
  b.addEventListener('click', ()=>{ $('f_fare').value = b.dataset.fare; });
});
$('wageChips').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  $('f_wage').value = e.target.dataset.val ?? '';
});

function updateBadges(){
  const pairs = [['foldCost',['f_fuel','f_wash','f_taxi','f_park','f_flag','f_other']],
                 ['foldNote',['f_note','f_back','f_monthly']]];
  pairs.forEach(([fid, keys])=>{
    const n = keys.filter(k=>$(k).value.trim()!=='').length;
    const head = $(fid).querySelector('.head');
    let b = head.querySelector('.badge');
    if(n>0){
      if(!b){ b = document.createElement('span'); b.className='badge'; head.insertBefore(b, head.querySelector('.arrow')); }
      b.textContent = '已填 '+n;
    }else if(b){ b.remove(); }
  });
}
['f_fuel','f_wash','f_taxi','f_park','f_flag','f_other','f_note','f_back','f_monthly'].forEach(id=>{
  $(id).addEventListener('input', updateBadges);
});

function readForm(){
  const dv = $('f_date').value;
  if(!dv){ toast('請先選日期'); return null; }
  const m = parseInt(dv.slice(5,7),10), d = parseInt(dv.slice(8,10),10);
  const name = $('f_name').value.trim(), trip = $('f_trip').value.trim();
  if(!name && !trip){ toast('請至少填客戶或行程'); return null; }
  const fareRaw = $('f_fare').value.trim();
  const e = {
    id: editingId || (Date.now() + '' + Math.floor(Math.random()*1000)),
    m, date: `${m}/${d}`, name, trip,
    fare: num(fareRaw),
    fareX: fareRaw==='X' || fareRaw==='x',
    fareNote: (fareRaw && fareRaw.toUpperCase()!=='X' && num(fareRaw)==null) ? fareRaw : null,
    note: $('f_note').value.trim()
  };
  for(const [fid,k] of Object.entries(FORM_NUM)) e[k] = num($(fid).value);
  return e;
}
function setForm(e){
  $('f_date').value = e ? dateVal(e.m, parseInt(e.date.split('/')[1],10)) : todayStr(0);
  $('f_name').value = e ? (e.name||'') : '';
  $('f_trip').value = e ? (e.trip||'') : '';
  $('f_fare').value = e ? (e.fare!=null ? e.fare : (e.fareX ? 'X' : (e.fareNote||''))) : '';
  for(const [fid,k] of Object.entries(FORM_NUM)) $(fid).value = e ? (e[k] ?? '') : '';
  $('f_note').value = e ? (e.note||'') : '';
  updateBadges();
}
function exitEdit(){
  editingId = null;
  $('editBanner').classList.remove('on');
  $('deleteBtn').style.display = 'none';
  $('saveBtn').textContent = '儲存這一筆';
}
$('saveBtn').addEventListener('click', ()=>{
  const e = readForm(); if(!e) return;
  const wasEditing = !!editingId;
  if(wasEditing){
    for(let i=1;i<=12;i++) store.months[i].entries = store.months[i].entries.filter(x=>x.id!==e.id);
  }
  store.months[e.m].entries.push(e);
  sortEntries(store.months[e.m].entries);
  save();
  curMonth = e.m;
  const keepDate = $('f_date').value;
  exitEdit(); setForm(null); $('f_date').value = keepDate;
  $('foldCost').classList.remove('open'); $('foldNote').classList.remove('open');
  setMonth(curMonth);
  if(wasEditing){ toast('已修改 ✓'); go('p-list'); }
  else{
    toast(`已儲存 ✓ 本月第 ${M().entries.length} 筆`);
    flashBtn($('saveBtn'), '✓ 已儲存');
  }
});
$('deleteBtn').addEventListener('click', async ()=>{
  if(!editingId) return;
  const e = findEntry(editingId);
  if(!(await ask(`確定要刪除這一筆嗎？\n\n${e?e.date:''}　${e?(e.name||''):''}`, {danger:true, okText:'刪除'}))) return;
  for(let i=1;i<=12;i++) store.months[i].entries = store.months[i].entries.filter(x=>x.id!==editingId);
  save(); exitEdit(); setForm(null);
  setMonth(curMonth); go('p-list');
  if(e) offerUndo(e);
});
$('clearBtn').addEventListener('click', ()=>{
  exitEdit(); setForm(null);
  $('foldCost').classList.remove('open'); $('foldNote').classList.remove('open');
  toast('已清空');
});
$('cancelEdit').addEventListener('click', ()=>{
  exitEdit(); setForm(null); go('p-list');
});

/* ════════════════ 常用快捷 ════════════════ */
function topValues(key, n){
  const count = {};
  for(let i=1;i<=12;i++) store.months[i].entries.forEach(e=>{
    const v = e[key]!=null ? String(e[key]).trim() : '';
    if(v) count[v] = (count[v]||0)+1;
  });
  return Object.keys(count).sort((a,b)=>count[b]-count[a]).slice(0,n);
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderChips(){
  let wages = topValues('wage', 6);
  ['700','800','900','1200'].forEach(w=>{ if(!wages.includes(w)) wages.push(w); });
  wages = wages.filter(w=>num(w)!=null).slice(0,7);
  $('wageChips').innerHTML = wages.map(v=>`<button class="chip" data-val="${v}" type="button">${v}</button>`).join('')
    + '<button class="chip clear" data-val="" type="button">清除</button>';
  $('dl_trip').innerHTML = topValues('trip',200).map(v=>`<option value="${escHtml(v)}">`).join('');
  $('dl_name').innerHTML = topValues('name',200).map(v=>`<option value="${escHtml(v)}">`).join('');
}

/* ════════════════ 統計 ════════════════
   結餘＝要繳回公司的錢：
   收到的現金 − 工資 − 墊付（支出/加油/計程車）− 回帳 − 勞健保（公司補貼） */
function totals(m){
  const md = M(m);
  const t = {fare:0,wage:0,fuel:0,wash:0,taxi:0,park:0,flag:0,other:0,back:0,monthly:0};
  md.entries.forEach(e=>{
    for(const k of NUMK){ if(typeof e[k]==='number') t[k]+=e[k]; }
  });
  t.spend = t.wash + t.park + t.flag + t.other;
  t.ins = laborVal();
  t.balance = t.fare - t.wage - t.spend - t.back - t.fuel - t.taxi - t.ins;
  return t;
}
function renderStats(){
  const t = totals(curMonth);
  const rows = [
    ['收到客人的錢', '', t.fare],
    ['工資', '', t.wage],
    ['支出', '洗車/停車/舉牌/其他', t.spend],
    ['回帳', '', t.back],
    ['加油', '', t.fuel],
    ['計程車', '', t.taxi],
    ['勞健保', '公司補貼', t.ins],
    ['月結（簽單）', '公司月底跟客戶收', t.monthly]
  ];
  $('statBox').innerHTML =
    rows.map(r=>`<div class="stat"><b>${r[0]}${r[1]?`<small>${r[1]}</small>`:''}</b><span>${money(r[2])}</span></div>`).join('') +
    `<div class="stat total"><b>繳回公司</b><span class="${t.balance<0?'neg':''}">${money(t.balance)}</span></div>`;
}

/* ════════════════ 紀錄清單 ════════════════ */
function renderList(){
  refreshHeader(); renderStats();
  // 最新的排最上面，方便隨手檢查剛記的內容（匯出時仍照日期排序）
  let es = M().entries.slice().reverse();
  // 搜尋：比對日期、客戶、行程、備註與金額
  const q = ($('f_search').value || '').trim().toLowerCase();
  $('statCard').style.display = q ? 'none' : 'block';
  if(q){
    es = es.filter(e=>{
      const hay = [e.date, e.name, e.trip, e.note, e.fareNote,
        e.fare, e.wage, e.fuel, e.wash, e.taxi, e.park, e.flag, e.other, e.back, e.monthly]
        .filter(v=>v!=null && v!=='').join(' ').toLowerCase();
      return hay.includes(q);
    });
    if(!es.length){
      $('listBox').innerHTML = `<div class="empty">找不到「${escHtml(q)}」<br>換個字再試試</div>`;
      return;
    }
  }
  if(!es.length){
    $('listBox').innerHTML = '<div class="empty">這個月還沒有紀錄<br>按下面的「記一筆」開始</div>';
    return;
  }
  const foundBar = q ? `<div class="day-found">找到 ${es.length} 筆</div>` : '';
  const label = {wage:'工資', fuel:'油資', wash:'洗車', taxi:'計程車', park:'停車', flag:'舉牌', other:'其他', back:'回帳', monthly:'月結'};
  $('listBox').innerHTML = foundBar + es.map(e=>{
    const nums = [];
    const fareTxt = e.fare!=null ? money(e.fare) : (e.fareX ? 'X' : (e.fareNote||''));
    if(fareTxt) nums.push(`<span><i>實收</i> ${escHtml(fareTxt)}</span>`);
    for(const k of ['wage','fuel','wash','taxi','park','flag','other','back','monthly']){
      if(e[k]!=null) nums.push(`<span><i>${label[k]}</i> ${money(e[k])}</span>`);
    }
    return `<div class="rec">
      <div class="top"><span class="day">${escHtml(e.date)}</span><span class="cust">${escHtml(e.name||'—')}</span></div>
      <div class="trip">${escHtml(e.trip||'')}</div>
      ${nums.length?`<div class="nums">${nums.join('')}</div>`:''}
      ${e.note?`<div class="trip">📝 ${escHtml(e.note)}</div>`:''}
      <div class="acts"><button class="ed" data-edit="${e.id}">修改</button><button class="de" data-del="${e.id}">刪除</button></div>
    </div>`;
  }).join('');
}
document.addEventListener('click', e=>{
  const ed = e.target.closest ? e.target.closest('[data-edit]') : null;
  const de = e.target.closest ? e.target.closest('[data-del]') : null;
  if(ed){
    const r = findEntry(ed.dataset.edit);
    if(!r) return;
    editingId = r.id; setForm(r);
    $('editBanner').classList.add('on');
    $('deleteBtn').style.display = 'block';
    $('saveBtn').textContent = '更新這一筆';
    if(r.fuel!=null||r.wash!=null||r.taxi!=null||r.park!=null||r.flag!=null||r.other!=null) $('foldCost').classList.add('open');
    if(r.note||r.back!=null||r.monthly!=null) $('foldNote').classList.add('open');
    go('p-add');
  }
  if(de){
    const r = findEntry(de.dataset.del);
    if(!r) return;
    ask(`確定要刪除這一筆嗎？\n\n${r.date}　${r.name||''}\n${r.trip||''}`, {danger:true, okText:'刪除'}).then(yes=>{
      if(!yes) return;
      for(let i=1;i<=12;i++) store.months[i].entries = store.months[i].entries.filter(x=>x.id!==r.id);
      save(); setMonth(curMonth); offerUndo(r);
    });
  }
});

function showLabor(){ $('laborShow').textContent = money(laborVal()); }
$('laborEdit').addEventListener('click', async ()=>{
  const v = await ask(`勞健保是公司固定補貼的，平常不用改。\n只有公司真的調整了才需要改。\n目前是 ${money(laborVal())} 元。`, {input: String(laborVal()), okText:'改成這個金額'});
  if(v === null) return;
  const n = num(v);
  if(n==null || n<0){ toast('請填數字，這次沒有更動'); return; }

});

/* ════════════════ Excel（.xlsx）產生器 ════════════════
   版面與公司 2026年8月 表相同：A~N 欄、133 列合計、右側 T3:Y11 月結區
   結餘公式同公司原檔：收入−工資−支出−回帳−加油−計程車−勞健保（＝繳回公司的錢） */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cText(ref, s, style){ return s==='' ? `<c r="${ref}" s="${style}"/>` : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${esc(s)}</t></is></c>`; }
function cNum(ref, v, style){ return `<c r="${ref}" s="${style}"><v>${v}</v></c>`; }
function cFor(ref, f, v, style){ return `<c r="${ref}" s="${style}"><f>${f}</f><v>${v}</v></c>`; }
function cEmpty(ref, style){ return `<c r="${ref}" s="${style}"/>`; }

const COLS = 'ABCDEFGHIJKLMN';
function sheetXml(monthIdx){
  const t = totals(monthIdx);
  const rows = [];
  const sumCells = {
    3: `${cText('T3','項目',1)}${cText('U3','金額',1)}${cText('X3','月結',1)}${cText('Y3','金額',1)}`,
    4: `${cText('T4','收入',2)}${cFor('U4','SUM(D133)',t.fare,3)}${cText('X4','簽單',2)}${cFor('Y4','SUM(N133)',t.monthly,3)}`,
    5: `${cText('T5','工資',2)}${cFor('U5','SUM(E133)',t.wage,3)}`,
    6: `${cText('T6','支出',2)}${cFor('U6','G133+I133+J133+K133',t.spend,3)}`,
    7: `${cText('T7','回帳',2)}${cFor('U7','SUM(M133)',t.back,3)}`,
    8: `${cText('T8','加油',2)}${cFor('U8','SUM(F133)',t.fuel,3)}`,
    9: `${cText('T9','計程車',2)}${cFor('U9','SUM(H133)',t.taxi,3)}`,
    10: `${cText('T10','勞健保',2)}${cNum('U10',t.ins,3)}`,
    11: `${cText('T11','結餘',1)}${cFor('U11','SUM(U4-U5-U6-U7-U8-U9-U10)',t.balance,4)}`
  };
  // 列1：標題（合併 A1:N1、綠底）
  rows.push(`<row r="1" ht="24" customHeight="1">` +
    COLS.split('').map((c,i)=> i===0
      ? `<c r="A1" s="5" t="inlineStr"><is><t>${YEAR}年${monthIdx}月</t></is></c>`
      : cEmpty(c+'1', 5)).join('') + `</row>`);
  // 列2：表頭
  const heads = ['日期','客戶名稱','行程','實收','工資','油資','洗車','計程車','停車','舉牌','其他費用','備註','回帳','月結'];
  rows.push(`<row r="2" ht="30" customHeight="1">` + heads.map((h,i)=>cText(COLS[i]+'2', h, 1)).join('') + `</row>`);
  // 資料列 3~132（整片格線）
  const es = M(monthIdx).entries.slice(); sortEntries(es);
  const numCols = {E:'wage', F:'fuel', G:'wash', H:'taxi', I:'park', J:'flag', K:'other'};
  for(let r=3; r<=132; r++){
    const e = es[r-3];
    const cs = [];
    if(e){
      cs.push(cText('A'+r, e.date, 2));
      cs.push(cText('B'+r, e.name||'', 2));
      cs.push(cText('C'+r, e.trip||'', 6));
      if(e.fare!=null) cs.push(cNum('D'+r, e.fare, 3));
      else if(e.fareX) cs.push(cText('D'+r, 'X', 2));
      else if(e.fareNote) cs.push(cText('D'+r, e.fareNote, 2));
      else cs.push(cEmpty('D'+r, 2));
      for(const [col,k] of Object.entries(numCols)){
        cs.push(e[k]!=null ? cNum(col+r, e[k], 3) : cEmpty(col+r, 2));
      }
      cs.push(cText('L'+r, e.note||'', 6));
      cs.push(e.back!=null ? cNum('M'+r, e.back, 3) : cEmpty('M'+r, 2));
      cs.push(e.monthly!=null ? cNum('N'+r, e.monthly, 3) : cEmpty('N'+r, 2));
    }else{
      COLS.split('').forEach(c=>cs.push(cEmpty(c+r, 2)));
    }
    rows.push(`<row r="${r}">` + cs.join('') + (sumCells[r]||'') + `</row>`);
  }
  // 列133：合計
  const sums = {D:t.fare, E:t.wage, F:t.fuel, G:t.wash, H:t.taxi, I:t.park, J:t.flag, K:t.other, L:0, M:t.back, N:t.monthly};
  rows.push(`<row r="133">` + cText('A133','',4) + cText('B133','',4) + cText('C133','合計',4) +
    Object.entries(sums).map(([c,v])=>cFor(c+'133', `SUM(${c}3:${c}132)`, v, 4)).join('') + `</row>`);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:Y133"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="17"/><cols><col min="1" max="1" width="7" customWidth="1"/><col min="2" max="2" width="11" customWidth="1"/><col min="3" max="3" width="28" customWidth="1"/><col min="4" max="6" width="8.6" customWidth="1"/><col min="7" max="11" width="7.6" customWidth="1"/><col min="12" max="12" width="14" customWidth="1"/><col min="13" max="14" width="8" customWidth="1"/><col min="20" max="21" width="10" customWidth="1"/><col min="24" max="25" width="10" customWidth="1"/></cols><sheetData>${rows.join('')}</sheetData><mergeCells count="1"><mergeCell ref="A1:N1"/></mergeCells><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/></worksheet>`;
}

function workbookFiles(){
  const enc = new TextEncoder();
  const files = [];
  const sheetTags = [], relTags = [], typeTags = [];
  for(let i=1;i<=12;i++){
    sheetTags.push(`<sheet name="${YEAR}年${i}月" sheetId="${i}" r:id="rId${i}"/>`);
    relTags.push(`<Relationship Id="rId${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`);
    typeTags.push(`<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    files.push(['xl/worksheets/sheet'+i+'.xml', enc.encode(sheetXml(i))]);
  }
  files.push(['[Content_Types].xml', enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${typeTags.join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`)]);
  files.push(['_rels/.rels', enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)]);
  files.push(['xl/workbook.xml', enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetTags.join('')}</sheets><calcPr fullCalcOnLoad="1"/></workbook>`)]);
  files.push(['xl/_rels/workbook.xml.rels', enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

/* zip（stored，不壓縮） */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const dosDate = ((YEAR-1980)<<9) | (1<<5) | 1;
  for(const [name, data] of files){
    const nameB = enc.encode(name);
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameB.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true); dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameB, 30);
    parts.push(local, data);
    const cent = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cent.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true); cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    cent.set(nameB, 46);
    central.push(cent);
    offset += local.length + data.length;
  }
  const centralSize = central.reduce((s,c)=>s+c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true); ev.setUint32(16, offset, true);
  const all = [...parts, ...central, eocd];
  const total = all.reduce((s,p)=>s+p.length, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for(const p of all){ out.set(p, pos); pos += p.length; }
  return out;
}
window.__exportBytes = ()=>zipStore(workbookFiles()); // 測試用

/* ════ 匯出前逐格核對：把產出的檔案讀回來，跟輸入的資料一格一格比對 ════ */
function verifyExport(files){
  const problems = [];
  let checked = 0;
  const parser = new DOMParser();
  const dec = new TextDecoder();
  const same = (got, want) => (got==null?'':got) === want || got === want;
  for(let m=1;m<=12;m++){
    const f = files.find(x=>x[0]===`xl/worksheets/sheet${m}.xml`);
    const doc = parser.parseFromString(dec.decode(f[1]), 'application/xml');
    if(doc.getElementsByTagName('parsererror').length){ problems.push(`${m}月：檔案內容無法解析`); continue; }
    const cells = {};
    for(const c of doc.getElementsByTagName('c')){
      const ref = c.getAttribute('r');
      if(c.getAttribute('t')==='inlineStr'){
        const tt = c.getElementsByTagName('t')[0];
        cells[ref] = tt ? tt.textContent : '';
      }else{
        const v = c.getElementsByTagName('v')[0];
        cells[ref] = v ? Number(v.textContent) : null;
      }
    }
    const es = store.months[m].entries.slice(); sortEntries(es);
    if(es.length>130) problems.push(`${m}月超過 130 筆，表格放不下`);
    const t = totals(m);
    const numKeys = {E:'wage',F:'fuel',G:'wash',H:'taxi',I:'park',J:'flag',K:'other',M:'back',N:'monthly'};
    es.slice(0,130).forEach((e,i)=>{
      const r = 3+i;
      const rowExpect = {A:e.date, B:e.name||'', C:e.trip||'', L:e.note||'',
        D: e.fare!=null ? e.fare : (e.fareX ? 'X' : (e.fareNote || ''))};
      for(const [col,k] of Object.entries(numKeys)) rowExpect[col] = e[k]!=null ? e[k] : '';
      for(const [col,want] of Object.entries(rowExpect)){
        if(!same(cells[col+r], want)) problems.push(`${m}月 第${i+1}筆 ${col}${r} 格：表內「${cells[col+r]}」≠ 輸入「${want}」`);
        else checked++;
      }
    });
    const sumExpect = {D133:t.fare,E133:t.wage,F133:t.fuel,G133:t.wash,H133:t.taxi,I133:t.park,
      J133:t.flag,K133:t.other,M133:t.back,N133:t.monthly,
      U4:t.fare,U5:t.wage,U6:t.spend,U7:t.back,U8:t.fuel,U9:t.taxi,U10:t.ins,U11:t.balance,Y4:t.monthly};
    for(const [ref,want] of Object.entries(sumExpect)){
      if(cells[ref] !== want) problems.push(`${m}月 合計 ${ref}：表內 ${cells[ref]} ≠ 應為 ${want}`);
      else checked++;
    }
  }
  return {ok: problems.length===0, checked, problems};
}
window.__verify = ()=>verifyExport(workbookFiles()); // 測試用

function buildVerified(){
  const files = workbookFiles();
  const v = verifyExport(files);
  if(!v.ok){
    ask('自動核對發現不一致，已停止產出，請截圖回報：\n\n' + v.problems.slice(0,6).join('\n'), {alert:true});
    return null;
  }
  buildVerified.lastChecked = v.checked;
  return zipStore(files);
}

/* ════════════════ 下載 / 傳送 / 備份 ════════════════ */
const FILE_NAME = `大雅車行-${YEAR}年員工月報表.xlsx`;
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}
$('exportBtn').addEventListener('click', function(){
  const btn = this; btn.textContent = '產生中…'; btn.disabled = true;
  setTimeout(()=>{
    try{
      const bytes = buildVerified();
      if(bytes){
        download(new Blob([bytes], {type:XLSX_MIME}), FILE_NAME);
        toast(`已核對 ${buildVerified.lastChecked.toLocaleString()} 格 ✓ 檔案在「下載項目」`);
      }
      if(bytes) btn._ok = true;
    }catch(err){ ask('產生失敗：'+err.message, {alert:true}); }
    btn.textContent = '下載 Excel 檔'; btn.disabled = false;
    if(btn._ok){ btn._ok = false; flashBtn(btn, '✓ 已產出'); }
  }, 50);
});
$('shareBtn').addEventListener('click', async function(){
  try{
    const bytes = buildVerified(); if(!bytes) return;
    const file = new File([bytes], FILE_NAME, {type:XLSX_MIME});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:FILE_NAME});
    }else{
      download(new Blob([bytes], {type:XLSX_MIME}), FILE_NAME);
      toast('這支手機不能直接傳，已改成下載');
    }
  }catch(e){ /* 使用者取消 */ }
});
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
$('backupBtn').addEventListener('click', function(){
  download(new Blob([JSON.stringify(store)], {type:'application/json'}), `車行記帳備份-${todayISO()}.json`);
  toast('備份檔已產生 ✓'); flashBtn(this, '✓ 已備份');
});
$('restoreBtn').addEventListener('click', ()=>$('restoreFile').click());
$('restoreFile').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d.months) throw 0;
    const n = Object.values(d.months).reduce((s,m)=>s+m.entries.length, 0);
    if(await ask(`要用備份檔取代目前的資料嗎？\n備份共 ${n} 筆。`, {okText:'還原'})){
      store = d; save(); setMonth(curMonth); renderChips(); showLabor(); toast('已還原 ✓');
    }
  }catch(err){ ask('還原失敗：檔案格式不正確', {alert:true}); }
  e.target.value = '';
});
